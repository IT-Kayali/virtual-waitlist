<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QueueUp – Counter</title>
<link rel="stylesheet" href="/styles.css">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QueueUp">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
<div class="guest-wrap">
  <div class="lang-picker" id="langPicker"></div>
  <img id="venueLogo" class="venue-logo hidden" alt="">
  <div class="venue-name" id="venueName">QueueUp</div>

  <p id="installHint" class="pwa-install hidden" role="note"></p>
  <button id="installBtn" class="btn ghost hidden" data-i18n="push_install_btn">QueueUp installieren</button>
  <div class="card join-card">
    <div class="kiosk-badge">🖥️ <span data-i18n="kiosk_badge">Counter</span></div>
    <h1 data-i18n="kiosk_title">Almost there!</h1>
    <p class="sub" data-i18n="kiosk_sub">Please hand your phone to our staff – they will enter your order.</p>
    <p id="installHint" class="pwa-install hidden" role="note"></p>
    <button id="installBtn" type="button" class="btn ghost hidden" data-i18n="push_install_btn">QueueUp installieren</button>
    <form id="kioskForm">
      <label data-i18n="your_name">Your name (optional)</label>
      <input type="text" id="nameInput" data-i18n-ph="name_ph" autocomplete="name">
      <label data-i18n="kiosk_order">Order</label>
      <input type="text" id="noteInput" data-i18n-ph="note_ph">
      <button type="submit" class="btn primary full" id="kioskBtn" data-i18n="kiosk_btn">Create my number</button>
      <p class="error" id="kioskError"></p>
    </form>
    <p class="privacy-foot"><a id="privacyLink" href="/privacy" data-i18n="privacy_link">Privacy</a></p>
  </div>
</div>
<script src="/i18n.js?v=0.6.0"></script>
<script src="/pwa.js?v=0.6.0"></script>
<script src="/kiosk.js?v=0.6.0"></script>
</body>
</html>
