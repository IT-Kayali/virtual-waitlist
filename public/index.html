<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QueueUp | Abholnummer</title>
<link rel="stylesheet" href="/styles.css?v=0.7.1">
<link rel="stylesheet" href="/counter.css?v=0.7.1">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QueueUp">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="referrer" content="no-referrer">
</head>
<body>
<main class="guest-wrap claim-wrap">
  <div class="lang-picker" id="langPicker"></div>
  <img id="venueLogo" class="venue-logo hidden" alt="">
  <div class="venue-name" id="venueName">QueueUp</div>
  <section class="card join-card">
    <div class="counter-pill">QueueUp · Counter</div>
    <h1 data-i18n="claim_title">Deine Nummer vom Counter</h1>
    <p class="sub" data-i18n="claim_intro"></p>
    <a id="currentTicketLink" class="btn ghost full hidden" data-i18n="claim_resume"></a>
    <form id="claimForm">
      <div id="manualFields">
        <label for="numberInput" data-i18n="claim_number"></label>
        <input id="numberInput" type="text" inputmode="numeric" pattern="[0-9]{1,9}" maxlength="9" autocomplete="off" required placeholder="42" dir="ltr">
      </div>
      <div id="qrNumberWrap" class="hidden">
        <p data-i18n="your_number"></p>
        <div id="qrNumber" class="claim-number" dir="ltr"></div>
      </div>
      <p id="claimState" class="ticket-sub" role="status"></p>
      <p class="error" id="claimError" role="alert"></p>
      <button id="claimBtn" type="submit" class="btn primary full" disabled data-i18n="claim_preparing"></button>
      <button id="skipBtn" type="button" class="btn ghost full hidden" data-i18n="claim_skip"></button>
    </form>
    <div class="install-panel" id="installPanel">
      <p id="installHint" class="pwa-install hidden" role="note"></p>
      <button id="installBtn" type="button" class="btn ghost hidden" data-i18n="push_install_btn"></button>
    </div>
    <p class="ticket-sub claim-notice" data-i18n="claim_optional"></p>
    <p class="ticket-sub hidden" id="iosClaimHint" data-i18n="claim_ios"></p>
    <p class="privacy-foot"><a id="privacyLink" href="/privacy" data-i18n="privacy_link"></a></p>
  </section>
</main>
<script src="/i18n.js?v=0.7.1"></script>
<script src="/pwa.js?v=0.7.1"></script>
<script src="/claim.js?v=0.7.1"></script>
</body>
</html>
